apiVersion: v1
kind: ConfigMap
metadata:
  name: staff-registry-config
data:
  DB_URL: "jdbc:postgresql://postgres-service:5432/staffdb"
  DB_USERNAME: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-registry
  labels:
    app: staff-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staff-registry
  template:
    metadata:
      labels:
        app: staff-registry
    spec:
      containers:
        - name: staff-registry
          image: devopscube/staff-registry:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: staff-registry-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: staff-registry-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # STARTUP PROBE
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # LIVENESS PROBE
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # READINESS PROBE
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: staff-registry-service
spec:
  selector:
    app: staff-registry
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 32000
      name: http
  type: NodePort
