apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
data:
  DB_URL: "jdbc:postgresql://postgres-service:5432/ordersdb"
  DB_USERNAME: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: devopscube/orders-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: orders-api-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: orders-api-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # STARTUP PROBE
          # Gives the JVM up to 30 x 10s = 300s to boot before liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            timeoutSeconds: 5
            failureThreshold: 30

          # LIVENESS PROBE
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            timeoutSeconds: 5

          # READINESS PROBE
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api-service
spec:
  selector:
    app: orders-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 32000
      name: http
  type: NodePort
